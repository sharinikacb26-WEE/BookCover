
<!DOCTYPE html>
<html>
<head>
    <title>Book Back Cover</title>

    <style>
        body {
            background-color: #f4e4d0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .cover {
            width: 350px;
            height: 500px;
            background-color: #243447;
            color: white;
            padding: 25px;
            text-align: center;
            box-shadow: 5px 5px 15px gray;
        }

        h1 {
            color: #f5c16c;
            margin-top: 40px;
        }

        p {
            line-height: 1.8;
            font-size: 15px;
        }

        .author {
            margin-top: 60px;
            color: #f5c16c;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="cover">
        <h1>THE POWER OF DREAMS</h1>

        <p>
            Every great journey begins with a dream.
            Believe in yourself, work hard and never
            give up on your goals.
        </p>

        <p>
            This book inspires readers to discover
            their potential and create a better future.
        </p>

        <div class="author">
            Written by John Smith
        </div>
    </div>

</body>
</html>
